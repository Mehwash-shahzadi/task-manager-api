[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "B", "BLE", "PLW", "RUF", "SIM"]
ignore = ["E501"]  # ruff format handles line length; long comments are allowed

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
check_untyped_defs = false
