# Settings shared by the API, the workers and Flower. Inside Compose the hosts are
# the service names, not localhost.
x-app-env: &app-env
  POSTGRES_HOST: db
  POSTGRES_PORT: "5432"
  REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
  CACHE_REDIS_URL: redis://:${CACHE_REDIS_PASSWORD}@redis-cache:6379/0
  CELERY_BROKER_URL: redis://:${REDIS_PASSWORD}@redis:6379/1
  CELERY_RESULT_BACKEND: redis://:${REDIS_PASSWORD}@redis:6379/2

# Extra safety for every container that runs our image: no Linux capabilities, no way to
# gain new privileges, and a read-only file system (only /tmp and the export volume are
# writable).
x-hardening: &hardening
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  read_only: true
  tmpfs: ["/tmp"]

services:
  db:
    image: postgres:16.15-alpine
    env_file: .env
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 3s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7.4.11-alpine
    # appendonly keeps the data on disk, so a restart does not lose the stream or the job queue.
    # noeviction: when memory is full, writes fail with an error. Redis never deletes
    # stream entries, job ids or queued jobs to make room.
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}", "--appendonly", "yes", "--maxmemory", "512mb", "--maxmemory-policy", "noeviction"]
    volumes:
      - redisdata:/data
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=$$REDIS_PASSWORD redis-cli ping | grep PONG"]
      interval: 3s
      timeout: 3s
      retries: 10

  # only the task cache. Losing it is fine, so: no disk, and when memory is full it
  # drops the least recently used keys (allkeys-lru)
  redis-cache:
    image: redis:7.4.11-alpine
    command: ["redis-server", "--requirepass", "${CACHE_REDIS_PASSWORD}", "--save", "", "--appendonly", "no", "--maxmemory", "128mb", "--maxmemory-policy", "allkeys-lru"]
    environment:
      REDIS_PASSWORD: ${CACHE_REDIS_PASSWORD}
    ports:
      - "127.0.0.1:6380:6379"
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=$$REDIS_PASSWORD redis-cli ping | grep PONG"]
      interval: 3s
      timeout: 3s
      retries: 10

  app:
    build: .
    <<: *hardening
    env_file: .env
    environment:
      <<: *app-env


    ports:
      - "${APP_PORT:-8010}:8000"
    volumes:
      - exports:/code/exports
    restart: unless-stopped
    # the slim image has no curl, so the check uses Python
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 3s
      retries: 5
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      redis-cache:
        condition: service_healthy

  stream-worker:
    build: .
    <<: *hardening
    env_file: .env
    # same image as the API, but runs the stream consumer instead of entrypoint.sh
    entrypoint: ["python", "-m", "app.messaging.worker"]
    environment:
      CONSUMER_NAME: stream-worker-1
      # only the database and the stream; the worker does not use Celery
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
    # the worker finishes its current read (up to CONSUMER_BLOCK_MS) before it exits
    stop_grace_period: 15s
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy

  # runs the Celery jobs (app/celery_jobs.py)
  celery-worker:
    build: .
    <<: *hardening
    env_file: .env
    entrypoint: ["celery", "-A", "app.celery_app", "worker", "-l", "info"]
    environment:
      <<: *app-env

    # give a running job time to finish before the container stops
    stop_grace_period: 30s
    volumes:
      - exports:/code/exports
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  # only sends jobs to the queue on a schedule. Run exactly ONE, or every job is scheduled twice
  celery-beat:
    build: .
    <<: *hardening
    env_file: .env
    entrypoint: ["celery", "-A", "app.celery_app", "beat", "-l", "info", "--schedule", "/tmp/celerybeat-schedule"]
    environment:
      <<: *app-env

    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  # web page to watch jobs: http://localhost:5555
  flower:
    build: .
    <<: *hardening
    env_file: .env
    entrypoint: ["celery", "-A", "app.celery_app", "flower", "--port=5555"]
    environment:
      <<: *app-env

    ports:
      - "127.0.0.1:5555:5555"
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  pgdata:
  redisdata:
  exports:
